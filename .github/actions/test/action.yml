name: 'Lint, Build & Test'
description: 'Run lint, build, unit and browser tests with coverage, and E2E tests'

runs:
  using: 'composite'
  steps:
    - run: corepack enable
      shell: bash

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: 'package.json'
        cache: 'pnpm'

    - run: pnpm install --frozen-lockfile
      shell: bash

    - run: pnpm lint
      shell: bash
    - run: pnpm build
      shell: bash

    - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        file: docker/Dockerfile
        load: true
        tags: blockoli-test:latest
        cache-from: ${{ github.ref_name != github.event.repository.default_branch && 'type=gha' || '' }}
        cache-to: ${{ github.ref_name == github.event.repository.default_branch && 'type=gha,mode=max' || '' }}
      env:
        DOCKER_BUILD_CHECKS_ANNOTATIONS: 'false'
        DOCKER_BUILD_SUMMARY: 'false'
        DOCKER_BUILD_RECORD_UPLOAD: 'false'

    - name: Run unit and browser tests with coverage
      id: browser-tests
      run: pnpm docker:test:coverage
      shell: bash

    - name: Add coverage to the job summary
      if: always() && hashFiles('coverage/summary.txt') != ''
      run: |
        {
          echo '### Coverage'
          echo '```'
          cat coverage/summary.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
      shell: bash

    - name: Upload VRT diff images
      if: failure() && steps.browser-tests.outcome == 'failure'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: vrt-diff-images
        path: .vitest/attachments/
        retention-days: 1

    - name: Run E2E tests
      id: e2e-tests
      run: pnpm docker:test:e2e
      shell: bash

    - name: Upload E2E traces
      if: failure() && steps.e2e-tests.outcome == 'failure'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: e2e-traces
        path: test-results/
        retention-days: 1
