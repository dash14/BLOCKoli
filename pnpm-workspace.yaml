minimumReleaseAge: 20160 # 14 days
minimumReleaseAgeExclude:
  - happy-dom@21.0.4 # Security fix, released less than 14 days ago
minimumReleaseAgeExcludePrune: true
engineStrict: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Backport release published by hand after 4.x moved to trusted publishing; @crxjs/vite-plugin pins it
  - rollup@2.80.0
  # Backport release published by hand after 7.x started shipping provenance
  - semver@6.3.1
trustPolicyExcludePrune: true
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  unrs-resolver: false
pmOnFail: download
